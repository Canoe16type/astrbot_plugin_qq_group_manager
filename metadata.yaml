name: astrbot_plugin_qq_group_manager
display_name: QQ 群管理
short_desc: QQ 官方机器人群管理：禁言 / 撤回 / 入群审批 / 欢迎语 + 群规审核 + 本地词库与 WebUI 七页签面板（词库仅本机拦截，不展示词条）
desc: QQ 官方机器人（官方 API）群管理插件：禁言 / 解禁 / 查禁言、消息撤回、入群审批与通知、欢迎语、多模式管理员判定，内置 WebUI 面板（概览 / 设置 / 群管 / 群规审核 / 词典 / 记录 / 日志七个页签），无需修改 AstrBot 本体代码。群规审核支持关键词 + 群规 + 语义 + 图片四维度判定，群规与开关按群独立配置，默认仅 /群管 举报 触发、默认试运行；按需开启变体检测（谐音 / 形近 / 插符号绕过，只撤回不禁言）、待办队列与复犯累进。词库为公开开源审核词表，仅本机过滤用，面板不展示词条内容，来源与免责见 lexicons/SOURCES.md。
help: |
  【群管指令】统一写成 /群管 <子指令>（除群规查看与举报外均需管理员权限）
  /群管                    列出指令树（会先回一句「参数不足」，属正常行为）
  /群管 帮助               完整帮助
  /群管 禁言 @用户 10分钟   禁言（支持 30秒 / 5分钟 / 2小时 / 1天 或纯数字=秒，可附理由）
  /群管 解禁 @用户          解除禁言
  /群管 查禁言             查看当前禁言中的成员
  /群管 禁言历史           历史禁言记录
  /群管 撤回               引用（回复）消息后发送，撤回该条；或 /群管 撤回 <消息ID>（官方限 2 分钟内）
  /群管 审批               待处理的入群申请列表
  /群管 通过 序号           批准对应申请
  /群管 拒绝 序号 [理由]    拒绝对应申请
  /群管 审核 [状态|试跑|巡检|测试|自我介绍]  群规审核诊断入口
  /群管 群规 [列表|添加|设置|删除|清空]      查看 / 维护本群群规
  /群管 群名               刷新本群群名
  /群管 管理登记 [列表|取消] 加入 / 查看 / 退出变体提醒名单
  /群管 举报               引用违规消息后发送，触发群规审核（全体成员可用，默认只判定不执行）
  【WebUI】插件详情页可打开管理面板；群规审核按「机器人 → 群名」分组，不同机器人管的群互不干扰
  【免责】内置词库为公开开源审核词表，仅本机过滤拦截、不对外发布，面板不展示词条；
  上游社区维护，可能误伤或漏词，作者不作保证，启用与合规使用由使用者自行判断（详见 lexicons/DISCLAIMER.md）
support_platforms:
  - qq_official
version: 1.0.1
astrbot_version: ">=4.16.0,<5"
author: Canoe16type
repo: https://github.com/Canoe16type/astrbot_plugin_qq_group_manager
entry: main.py
tags:
  - QQ
  - 群管理
  - 禁言
  - 入群审批
  - 管理
  - WebUI
  - 内容审核
  - 词库
