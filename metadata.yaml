name: astrbot_plugin_qq_group_manager
display_name: QQ官机群管
short_desc: QQ 官方机器人群管：禁言 / 撤回 / 入群审批 / 群规审核，内置九页签 WebUI 面板，零第三方依赖
desc: >
  QQ 官方机器人的群管插件（QQ官机群管）—— 把「群主该干的活」交给机器人：
  禁言 / 解禁 / 查禁言、消息撤回、入群审批（含按钮一键通过 / 拒绝）、欢迎语、成员档案、
  退群与被移出通知，外加一套四维群规审核（关键词 · 群规 · 语义 · 图片）。

  【怎么判】先走关键词与缓存，零成本直接出结论；拿不准才交给模型按你写的群规判断，
  命中才动手。默认只对 /群管 举报 生效、默认试运行，每次判定与处罚全程留痕，可回看、可改判。

  【怎么用】统一入口 /群管 <子指令>，装完即可用；不想记指令就开面板 —— 九个页签
  （概览 / 设置 / 群管 / 入群审批 / 群规审核 / 成员档案 / 词典 / 记录 / 日志），
  按「机器人 → 群名」分组管理多个群；模型层可随时关掉，只留关键词层也不影响使用。

  【适配】仅支持 AstrBot 的 qq_official / qq_official_webhook 适配器；不支持 OneBot v11 /
  NapCat / Lagrange 等第三方协议端。零第三方依赖，不改 AstrBot 本体代码。

  【边界】群规与开关按群独立配置；词库为公开开源审核词表，仅本机过滤，面板不展示词条；
  所有数据保存在本地数据目录，不上传任何第三方。
help: |
  【群管指令】统一写 /群管 <子指令>；完整说明见 docs/GUIDE.md「指令手册」
  /群管 禁言 @用户 10分钟 [理由]｜解禁｜查禁言｜禁言历史
  /群管 撤回            引用消息后发送，官方限 2 分钟内
  /群管 审批 [页码|全部]｜通过 序号｜拒绝 序号 [理由]
  /群管 汇报            立刻看群管日报（待处理申请 + 禁言人数）
  /群管 成员 [改名 序号 昵称]     群成员档案（openid ↔ 昵称）
  /群管 群规 [列表|添加|设置|删除]  群规与开关按群独立配置
  /群管 审核 [状态|试跑|巡检|测试]  群规审核诊断入口
  /群管 体检 [清理]      确认机器人还在不在已记录的群里（默认只报告）
  /群管 举报            引用消息后发送，全体成员可用，默认只判定不执行
  【WebUI】插件详情页可打开管理面板，跨机器人按「机器人 → 群名」分组
  【免责】内置词库仅本机过滤，面板不展示词条，详见 lexicons/DISCLAIMER.md
support_platforms:
  - qq_official
  - qq_official_webhook
version: 1.5.0
astrbot_version: ">=4.16.0,<5"
author: Canoe16type
repo: https://github.com/Canoe16type/astrbot_plugin_qq_group_manager
entry: main.py
tags:
  - QQ
  - 群管理
  - 禁言
  - 入群审批
  - 管理
  - WebUI
  - 内容审核
  - 词库
