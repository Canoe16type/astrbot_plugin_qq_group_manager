name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 自检（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装校验依赖
        run: python -m pip install --upgrade pip pyyaml pyflakes

      - name: 语法编译
        run: python -m compileall -q *.py tools tests

      - name: 静态检查（未定义名 / 重复定义）
        run: |
          out=$(python -m pyflakes main.py qgm || true)
          echo "$out"
          if echo "$out" | grep -E "undefined name|redefinition"; then
            echo "::error::存在未定义名或重复定义"
            exit 1
          fi

      - name: 元数据与配置校验
        run: python tools/check_metadata.py

      - name: 仓库卫生检查
        run: |
          set -e
          if git grep -n "/root/" -- '*.py' '*.md' '*.yaml' '*.json'; then
            echo "::error::提交内容里出现本机绝对路径"
            exit 1
          fi
          if git ls-files | grep -qE '__pycache__|\.pyc$|lexicon_state\.json|plugin_data/'; then
            echo "::error::误提交了编译产物 / 运行时状态"
            exit 1
          fi
          echo "卫生检查通过"

      - name: 安装运行测试依赖
        run: python -m pip install --quiet astrbot

      - name: 运行完整测试（加载器 / 资源路径 / 366 例）
        run: |
          mkdir -p /tmp/qgm/plugins
          cp -r "$GITHUB_WORKSPACE" /tmp/qgm/plugins/astrbot_plugin_qq_group_manager
          PYTHONPATH=/tmp/qgm python -m unittest discover -s tests -v
