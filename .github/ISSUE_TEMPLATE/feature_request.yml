name: 功能建议
description: 想要新功能或改进现有行为
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 先讲场景，不要一上来就给方案。「我在 X 情况下做不到 Y」比「加个 Z 按钮」有用得多。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法（可选）
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      multiple: true
      options:
        - 禁言 / 解禁
        - 消息撤回
        - 入群审批 / 欢迎
        - 群规审核（/举报）
        - 词典 / 词库
        - 变体检测 / 待办队列
        - 管理面板（WebUI）
        - 配置项
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      options:
        - label: 我理解本插件只支持 `qq_official` 平台，不打算加其他平台的适配请求
          required: true
        - label: 我理解平台限制（撤回 2 分钟、退群通知不可用等）不是 bug
          required: true
