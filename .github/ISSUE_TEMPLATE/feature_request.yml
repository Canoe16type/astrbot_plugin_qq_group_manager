name: 功能建议
description: 想要新能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        当前版本 **1.10.0**。提建议前请先搜索是否已有同类 issue。
        1.7.x 阶段以稳定性与缺陷修复优先，新功能会排期评估。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 场景
      description: 现在怎么用、哪里不方便、影响多大
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 如果有具体指令 / 面板交互 / 配置项，写清楚更好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
    validations:
      required: false
