name: 功能异常
description: 插件没按预期工作（非安全问题）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先看 README 的 [常见问题](https://github.com/Canoe16type/astrbot_plugin_qq_group_manager#常见问题) 与 [CHANGELOG](https://github.com/Canoe16type/astrbot_plugin_qq_group_manager/blob/main/CHANGELOG.md)。

        **当前版本 1.7.1**：指令统一为 `/群管 <子指令>`（如 `/群管 禁言 名单`、`/群管 审批 通过 1`、`/群管 状态 自检`）。
        旧写法（`/群管 解禁`、`/群管 汇报` 等）自 1.6.0 起已移除。

        ⚠️ 提交前删除日志中的 **AppID / AppSecret / openid / 群号 / 成员昵称**。

  - type: dropdown
    id: plugin-version
    attributes:
      label: 插件版本
      description: 插件管理页或 Release 页可见
      options:
        - 1.9.0（最新）
        - 1.8.0
        - 1.7.1
        - 1.6.0
        - 1.5.x
        - 更早
        - 不确定 / 自己改过代码
    validations:
      required: true

  - type: input
    id: astrbot-version
    attributes:
      label: AstrBot 版本
      placeholder: "4.30.0"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options: [Docker, 源码 / 虚拟环境, 其他]
    validations:
      required: true

  - type: dropdown
    id: smart-penalty
    attributes:
      label: 是否开启「智能分级处罚」
      description: 群规审核 → 设置 → 处罚策略；判定/处罚类问题必填
      options: [未开启, 已开启, 不确定]
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的模块
      multiple: true
      options:
        - 禁言 / 解除 / 名单 / 历史
        - 消息撤回
        - 入群审批 / 欢迎
        - 群规审核（举报 / 巡检 / 模型）
        - 处罚撤销与判定记录
        - 状态与自检
        - 词典 / 词库 / 变体
        - 管理面板
        - 配置项
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么
      description: 哪个群、谁、发了什么、机器人回了什么 / 没回什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 群里发 /群管 审批 通过 1
        2. 机器人回复「…」
        3. 实际没有通过，申请仍在列表
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 日志与自检
      description: 贴 `/群管 状态 自检` 输出；判定类再附「记录 ID」与详情里的判定依据（policy_trace）。日志请脱敏。
      render: shell
    validations:
      required: true
