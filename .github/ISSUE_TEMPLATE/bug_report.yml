name: 功能异常
description: 插件没按预期工作（不是安全问题）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先看 README 的 [常见问题](https://github.com/Canoe16type/astrbot_plugin_qq_group_manager#常见问题) 和 [CHANGELOG](https://github.com/Canoe16type/astrbot_plugin_qq_group_manager/blob/main/CHANGELOG.md)。很多问题（撤回 2 分钟时限、退群通知不生效、机器人不是群管）在那里就能找到答案。

        **1.5.0 起指令已合并**：请优先用新写法——`/群管 禁言 解除`、`/群管 禁言 名单`、`/群管 禁言 历史`、`/群管 审批 通过`、`/群管 审批 拒绝`、`/群管 状态`、`/群管 状态 群`、`/群管 状态 自检`、`/群管 状态 群名`。
        旧写法（`/群管 解禁`、`/群管 查禁言`、`/群管 禁言历史`、`/群管 通过`、`/群管 拒绝`、`/群管 汇报`、`/群管 体检`、`/群管 自检`、`/群管 群名`）目前仍可用，**1.6.0 起移除**。
        用旧写法的报障也收，但请在下面注明写法，方便区分「兼容层问题」和「新逻辑问题」。

        ⚠️ **提交前请删掉日志里的 AppID / AppSecret / openid / 群号 / 成员昵称。**
  - type: dropdown
    id: plugin-version
    attributes:
      label: 插件版本
      description: AstrBot「插件管理」页或仓库 Release 里可以看到
      options:
        - 1.5.0（最新）
        - 1.4.x
        - 1.3.x
        - 1.2.x 或更早
        - 不确定 / 自己改过代码
    validations:
      required: true
  - type: input
    id: astrbot-version
    attributes:
      label: AstrBot 版本
      placeholder: "4.29.4"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 终端执行 python -V 得到；Docker 部署填镜像自带的即可
      placeholder: "3.12.3"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker
        - 源码 / 虚拟环境
        - 其他（在补充说明里写明）
    validations:
      required: true
  - type: dropdown
    id: command-style
    attributes:
      label: 你用的指令写法
      description: 1.5.0 起新旧写法并存，报障时区分一下能少一轮确认
      options:
        - 新写法（/群管 禁言 解除 …、/群管 审批 通过 …、/群管 状态 …）
        - 旧写法（/群管 解禁 …、/群管 通过 …、/群管 汇报 …，1.6.0 移除）
        - 两种写法都试过，结果一样
        - 与指令无关（面板 / 自动逻辑 / 事件通知）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的模块
      multiple: true
      options:
        - 禁言（禁言 / 解除 / 名单 / 历史）
        - 消息撤回
        - 入群审批（列表 / 通过 / 拒绝 / 自动审批策略 / 欢迎）
        - 群规审核（/群管 举报、巡检、模型判定）
        - 判定记录 / 详情 / 导出 CSV
        - 模型调用（并发闸门 / 超时 / 每日预算）
        - 状态与自检（/群管 状态）
        - 词典 / 词库
        - 变体检测 / 待办队列
        - 管理面板（WebUI）
        - 配置项
        - 其他
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么
      description: 越具体越好：谁在哪个群发了什么，机器人回了什么 / 没回什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 群里发 /群管 审批 通过 1
        2. 机器人回复「…」
        3. 实际没有通过，申请还在列表里
    validations:
      required: true
  - type: textarea
    id: selfcheck
    attributes:
      label: /群管 状态 自检 的输出
      description: 在出问题的群里发 `/群管 状态 自检`，把返回整段贴进来（脱敏）。它包含开关、审核模型、今日用量、并发与最近一次模型调用，能省很多来回。
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        AstrBot 控制台日志，或 `data/plugin_data/qq_group_manager/` 下的日志片段，记得脱敏。
        审核类问题建议把日志级别调到 DEBUG 后再复现一次——1.5.0 起会打印 `[模型]` 行（provider、耗时、token、原始返回），
        以及「没调模型」的原因（模型层关闭 / 找不到 provider / 达每日上限 / 排队已满 / 关键词命中）。
      render: shell
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        「机器人判错了」类问题，面板「记录」页 → 原文列可以看完整判定详情，点「⭳ 导出 CSV」还能把记录带走，贴上关键几行比截图有用。
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本（面板问题必填）
      description: 只有「管理面板（WebUI）」相关问题需要填，其他问题可留空
      placeholder: "Edge 141"
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我确认已删掉日志中的 AppID / AppSecret / openid / 群号 / 昵称
          required: true
        - label: 我确认机器人是群管理员，且群消息范围已设为「获取群内全部消息」
          required: true
        - label: 我已在最新版本（1.5.0）上复现，或已说明为何必须留在旧版本
          required: true
        - label: 我已把旧写法换成新写法（如 `/群管 禁言 解除`、`/群管 状态 自检`）重新试过一次
          required: true
        - label: 我理解旧指令只是 1.5.0 的兼容别名，会在 1.6.0 移除
          required: true
